spring:
  application:
    name: pp_bd_competask

  # datasource:
  #   url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/pp_bd_competask}
  #   username: ${DATASOURCE_USER:root}
  #   password: ${DATASOURCE_PWD:}
  #   driver-class-name: ${DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/pp_bd_competask}
    username: ${DATASOURCE_USER:postgres}
    password: ${DATASOURCE_PWD:}
    driver-class-name: ${DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update   # create, create-drop, validate, none, update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      
  springdoc:
    swagger-ui:
      path: /docs
    api-docs:
      path: /openapi-specs

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
