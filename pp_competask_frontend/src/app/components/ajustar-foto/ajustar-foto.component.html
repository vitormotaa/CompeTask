<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ajustar-foto-titulo">
  <div class="editor">
    <h2 id="ajustar-foto-titulo">Ajustar foto de perfil</h2>
    <p>Use os controles para posicionar e aproximar a foto.</p>
    <div class="preview">
      <img [src]="src" alt="Pré-visualização do recorte"
        [style.width.%]="larguraPreview" [style.height.%]="alturaPreview"
        [style.left.%]="(100 - larguraPreview) * posicaoX / 100"
        [style.top.%]="(100 - alturaPreview) * posicaoY / 100"
        (load)="carregarImagem($event)" (error)="erro = 'Não foi possível carregar a imagem.'" />
    </div>
    <label>Posição horizontal
      <input type="range" min="0" max="100" [value]="posicaoX" (input)="alterarPosicao($event, 'x')" />
    </label>
    <label>Posição vertical
      <input type="range" min="0" max="100" [value]="posicaoY" (input)="alterarPosicao($event, 'y')" />
    </label>
    <label>Zoom
      <input type="range" min="1" max="3" step="0.01" [value]="zoom" (input)="alterarPosicao($event, 'zoom')" />
    </label>
    <p class="erro" *ngIf="erro" role="alert">{{ erro }}</p>
    <div class="acoes">
      <button type="button" (click)="cancelar.emit()">Cancelar</button>
      <button type="button" class="confirmar" [disabled]="!largura || !altura" (click)="aplicar()">Usar foto</button>
    </div>
  </div>
</div>
